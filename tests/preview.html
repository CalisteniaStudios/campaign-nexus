<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Campaign Nexus UI Preview</title>
  <link rel="stylesheet" href="../styles/campaign-nexus.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>body{margin:0;background:#080a10}.cn-overlay{--cn-accent:#d7a642;--cn-text:#fff;--cn-darkness:.46;--cn-transition:1ms}</style>
</head>
<body class="campaign-nexus-active">
  <div id="campaign-nexus-overlay" class="cn-overlay is-visible is-gm" aria-hidden="false">
    <div class="cn-background" aria-hidden="true"></div><div class="cn-shade" aria-hidden="true"></div>
    <header class="cn-header">
      <button class="cn-brand"><span class="cn-logo-slot"><i class="fa-solid fa-compass"></i></span><span class="cn-brand-copy"><strong>Crônicas de Arton</strong><small>Uma jornada através do impossível</small></span></button>
      <div class="cn-header-actions"><button class="cn-icon-button"><i class="fa-solid fa-gear"></i></button><button class="cn-icon-button"><i class="fa-solid fa-xmark"></i></button></div>
    </header>
    <nav class="cn-navigation">
      <button class="is-active"><i class="fa-solid fa-map"></i><span>Mapas</span></button><button><i class="fa-solid fa-users"></i><span>Personagens</span></button><button><i class="fa-solid fa-book-open"></i><span>Diários</span></button><button><i class="fa-solid fa-store"></i><span>Lojas</span></button><button><i class="fa-solid fa-list-check"></i><span>Missões</span></button><button><i class="fa-solid fa-box-archive"></i><span>Compêndios</span></button><button><i class="fa-solid fa-comments"></i><span>Chat</span></button>
    </nav>
    <main class="cn-content">
      <header class="cn-page-header"><span class="cn-page-icon"><i class="fa-solid fa-map"></i></span><div><h1>Mapas</h1><p>6 itens</p></div></header>
      <label class="cn-search"><i class="fa-solid fa-magnifying-glass"></i><input placeholder="Procurar mapas..."></label>
      <div class="cn-library-grid">
        <article class="cn-library-card cn-map-card"><div class="cn-card-art" style="background:linear-gradient(135deg,#5f3824,#161820)"></div><div class="cn-card-body"><h2>Arton</h2><p>Cena ativa</p></div><div class="cn-card-actions"><button><i class="fa-solid fa-eye"></i>Visualizar</button><button><i class="fa-solid fa-bolt"></i>Ativar</button></div></article>
        <article class="cn-library-card cn-map-card"><div class="cn-card-art" style="background:linear-gradient(135deg,#234f5f,#111a25)"></div><div class="cn-card-body"><h2>Valkaria</h2><p>&nbsp;</p></div><div class="cn-card-actions"><button><i class="fa-solid fa-eye"></i>Visualizar</button><button><i class="fa-solid fa-bolt"></i>Ativar</button></div></article>
        <article class="cn-library-card cn-map-card"><div class="cn-card-art" style="background:linear-gradient(135deg,#3c275f,#15111f)"></div><div class="cn-card-body"><h2>As Montanhas Sanguinárias</h2><p>&nbsp;</p></div><div class="cn-card-actions"><button><i class="fa-solid fa-eye"></i>Visualizar</button><button><i class="fa-solid fa-bolt"></i>Ativar</button></div></article>
        <article class="cn-library-card cn-map-card"><div class="cn-card-art" style="background:linear-gradient(135deg,#57602b,#10150d)"></div><div class="cn-card-body"><h2>Floresta de Tollon</h2><p>&nbsp;</p></div><div class="cn-card-actions"><button><i class="fa-solid fa-eye"></i>Visualizar</button><button><i class="fa-solid fa-bolt"></i>Ativar</button></div></article>
      </div>
    </main>
    <footer class="cn-footer"><div class="cn-footer-status"></div><div class="cn-gm-controls"><button class="cn-button cn-button-secondary"><i class="fa-solid fa-users-viewfinder"></i><span>Abrir para todos</span></button><button class="cn-button cn-button-primary"><i class="fa-solid fa-play"></i><span>Iniciar o jogo</span></button></div></footer>
    <div class="cn-lightbox" hidden></div>
  </div>
</body>
</html>
